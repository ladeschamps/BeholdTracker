server:
  port: 8080

spring:
  application:
    name: beholdtracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beholdtracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Global Application Defaults & Configurations (Section 4.1, 5.2, 6.1)
beholdtracker:
  defaults:
    buy-operational-cost: 5.00
    sell-operational-cost: 7.00
    expected-profit-rate-aa: 10.0
  price-provider:
    active: MOCK
  cache:
    prices:
      ttl-minutes: 15
